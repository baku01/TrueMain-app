[workspace]
resolver = "2"
members = ["crates/lcu", "crates/live-client", "crates/shell-state", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
thiserror = "2"
tracing = "0.1"

# The shipped build: one codegen unit and thin LTO for a smaller, faster binary,
# symbols stripped. Panics still unwind — a panic in one background task must
# not take the whole app down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
