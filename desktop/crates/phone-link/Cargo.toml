[package]
name = "phone-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The link between the app and the player's phone: pairing, the sealed channel, and what a phone may ask."

# Free of Tauri, of the LCU and of any I/O: the desktop's connector and the
# mobile app both build on it, and its tests run anywhere.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
