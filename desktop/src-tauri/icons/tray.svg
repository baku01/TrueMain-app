<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 7 50 50">
  <!-- The tray's and the menu bar's icon: TrueMain's M-check mark alone, no
       tile, as Blitz's bolt sits in the tray — the brand's own colours on
       Windows (tray.png). The ramp is the site mark's
       (web/public/brand/truemain-mark.svg), the stroke thickened to stay
       legible at 16 px; the view box hugs it.
       macOS keeps a template image (tray-template.png): the menu bar tints it
       for its light or dark look, as every icon there is. Regenerate both with:
         rsvg-convert -w 32 -h 32 tray.svg -o tray.png
         sed 's/url(#g)/#000/' tray.svg | rsvg-convert -w 44 -h 44 -o tray-template.png -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cfa6"/>
      <stop offset="0.55" stop-color="#e2917e"/>
      <stop offset="1" stop-color="#8a3b44"/>
    </linearGradient>
  </defs>
  <path d="M13 47V21l15 17L51 15" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
