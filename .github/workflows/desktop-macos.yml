name: Desktop macOS build

on:
  push:
    branches-ignore: [develop, master]
    paths: ["desktop/**", "web/layers/common/**", "web/shared/**", "!**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      - name: Build the capture helper
        run: |
          swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos
          bin="$(swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos --show-bin-path)"
          mkdir -p desktop/src-tauri/binaries
          cp "$bin/truemain-capture" desktop/src-tauri/binaries/truemain-capture
          codesign --force --sign - desktop/src-tauri/binaries/truemain-capture
          lipo -archs desktop/src-tauri/binaries/truemain-capture
      - name: Build the app
        working-directory: desktop/app
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > ../flavor.json
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --config flavor.json
      - name: Check the bundle
        run: |
          bundle=desktop/target/universal-apple-darwin/release/bundle
          app=$(ls -d "$bundle"/macos/*.app)
          test -x "$app/Contents/MacOS/truemain-capture"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          cp "$bundle"/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v7
        with:
          name: truemain-macos-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
