name: Desktop build

on:
  push:
    branches-ignore: [develop, master]
    paths: ["desktop/**", "web/layers/common/**", "web/shared/**", "!**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# On main every build publishes the downloads, so a push waits for the build
# before it rather than cancelling it — a cancelled build publishes nothing,
# and the release would skip that commit. Elsewhere only the newest matters.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per Mac: Apple Silicon (M1, M2…) natively, and Intel apart,
          # each its own download and update (`latest.json`'s darwin-aarch64 and darwin-x86_64).
          - name: macOS-AppleSilicon
            runner: macos-15
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            bundle: desktop/target/aarch64-apple-darwin/release/bundle
          - name: macOS-Intel
            runner: macos-15
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            bundle: desktop/target/x86_64-apple-darwin/release/bundle
          - name: Windows
            runner: windows-2025
            rust-targets: ""
            args: --bundles nsis
            bundle: desktop/target/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      # Every build is a version of its own (0.5.<run>), so an installed app sees
      # the next one as newer, and its update bundles are signed for the
      # in-app updater (the public key is `plugins.updater.pubkey`).
      - name: Build the app
        shell: bash
        env:
          FLAVOR: '{"version":"0.5.${{ github.run_number }}","bundle":{"createUpdaterArtifacts":true}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "$FLAVOR" > desktop/flavor.json
          cd desktop/app
          npm run tauri -- build ${{ matrix.args }} --config flavor.json
      - name: Collect the installer
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            name="TrueMain-${{ matrix.name }}"
            app=$(ls -d "$BUNDLE"/macos/*.app)
            codesign --verify --deep --strict "$app"
            cp "$BUNDLE"/dmg/*.dmg "dist/$name.dmg"
            # The in-app update: the app bundle, archived, and its signature.
            cp "$BUNDLE"/macos/*.app.tar.gz "dist/$name.app.tar.gz"
            cp "$BUNDLE"/macos/*.app.tar.gz.sig "dist/$name.app.tar.gz.sig"
          else
            cp "$BUNDLE"/nsis/*-setup.exe dist/TrueMain-Windows-setup.exe
            # On Windows the installer is the update; its signature beside it.
            cp "$BUNDLE"/nsis/*-setup.exe.sig dist/TrueMain-Windows-setup.exe.sig
          fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: truemain-${{ matrix.name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the downloads
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: truemain-*
          path: dist
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/TrueMain-macOS-AppleSilicon.dmg dist/TrueMain-macOS-Intel.dmg dist/TrueMain-Windows-setup.exe dist/TrueMain-macOS-AppleSilicon.app.tar.gz dist/TrueMain-macOS-AppleSilicon.app.tar.gz.sig dist/TrueMain-macOS-Intel.app.tar.gz dist/TrueMain-macOS-Intel.app.tar.gz.sig dist/TrueMain-Windows-setup.exe.sig)
          existing=()
          for file in "${files[@]}"; do [ -f "$file" ] && existing+=("$file"); done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "::error::Neither platform produced an installer"
            exit 1
          fi
          # Every platform or none: the release is replaced whole, so one built
          # alone (a runner GitHub did not start) would take the others'
          # downloads and updates away — the latest release stays as it is.
          for needed in dist/TrueMain-macOS-AppleSilicon.dmg dist/TrueMain-macOS-AppleSilicon.app.tar.gz dist/TrueMain-macOS-Intel.dmg dist/TrueMain-macOS-Intel.app.tar.gz dist/TrueMain-Windows-setup.exe; do
            if [ ! -f "$needed" ]; then
              echo "::error::$needed was not built: the latest release is left as it is"
              exit 1
            fi
          done
          ls -la dist
          # The in-app updater's feed (`plugins.updater.endpoints`): this
          # build's version, and per platform the bundle and its signature.
          base="https://github.com/$GH_REPO/releases/download/latest"
          sig() { [ -f "$1" ] && cat "$1" || true; }
          arm_sig=$(sig dist/TrueMain-macOS-AppleSilicon.app.tar.gz.sig)
          intel_sig=$(sig dist/TrueMain-macOS-Intel.app.tar.gz.sig)
          win_sig=$(sig dist/TrueMain-Windows-setup.exe.sig)
          jq -n \
            --arg version "0.5.$GITHUB_RUN_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Build $GITHUB_SHA" \
            --arg arm_url "$base/TrueMain-macOS-AppleSilicon.app.tar.gz" --arg arm_sig "$arm_sig" \
            --arg intel_url "$base/TrueMain-macOS-Intel.app.tar.gz" --arg intel_sig "$intel_sig" \
            --arg win_url "$base/TrueMain-Windows-setup.exe" --arg win_sig "$win_sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: (
              (if $arm_sig != "" then {"darwin-aarch64": {url: $arm_url, signature: $arm_sig}} else {} end)
              + (if $intel_sig != "" then {"darwin-x86_64": {url: $intel_url, signature: $intel_sig}} else {} end)
              + (if $win_sig != "" then {"windows-x86_64": {url: $win_url, signature: $win_sig}} else {} end))}' > dist/latest.json
          cat dist/latest.json
          gh release delete latest --yes || true
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
          gh release create latest "${existing[@]}" dist/latest.json \
            --verify-tag \
            --title "TrueMain App — build mais recente" \
            --latest \
            --notes "Build automático 0.5.$GITHUB_RUN_NUMBER do commit $GITHUB_SHA na branch main. Instalado uma vez, o app se atualiza sozinho a partir daqui. Os instaladores não são assinados: no macOS, rode \`xattr -cr /Applications/TrueMain.app\` depois de copiar o app; no Windows, o SmartScreen pede para confirmar ('Mais informações' → 'Executar assim mesmo')."
